services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.12
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # How long a session can be inactive before Zookeeper considers the
      # client dead. 2000ms * 20 = 40s. Low values cause false positives
      # under load; high values delay broker failure detection.
      ZOOKEEPER_MAX_SESSION_TIMEOUT_MS: 40000

  kafka:
    image: confluentinc/cp-kafka:7.6.12
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Disable auto topic creation. Topics should be explicitly created with
      # intentional partition counts. Auto-creation silently uses default
      # (1 partition) which immediately caps consumer parallelism.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retain messages for 24 hours locally. Production default is 7 days.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot container that creates topics then exits.
  # service_completed_successfully ensures consumers don't start before
  # topics exist — which causes a confusing UNKNOWN_TOPIC error.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.12
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        kafka-topics --create --if-not-exists \
          --topic order_events \
          --bootstrap-server kafka:29092 \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=86400000

        kafka-topics --create --if-not-exists \
          --topic order_events_dlq \
          --bootstrap-server kafka:29092 \
          --partitions 1 \
          --replication-factor 1

        echo "Topics created:"
        kafka-topics --list --bootstrap-server kafka:29092

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastdb}
      POSTGRES_USER: ${POSTGRES_USER:-fastuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastpass}
    volumes:
      - sos_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastuser} -d ${POSTGRES_DB:-fastdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: ./src/django-api
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: fastcommerce.settings
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: "True"
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fastdb}
      POSTGRES_USER: ${POSTGRES_USER:-fastuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastpass}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./src/django-api:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"

  order-processor:
    build:
      context: ./src/order-processor
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fastdb}
      POSTGRES_USER: ${POSTGRES_USER:-fastuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastpass}
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: ./src/notification-service
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  sos_postgres_data: